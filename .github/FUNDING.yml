# GitHub 會依這個檔案在 repo 頁面顯示「Sponsor」按鈕（只有 GitHub 認得，Gitea 會忽略）。
# 說明：https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
